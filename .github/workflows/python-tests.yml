name: Python tests

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit pytest flake8 black

      - name: Lint (flake8)
        run: flake8 app.py app_functions.py test_app.py

      - name: Format check (black)
        run: black --check app.py app_functions.py test_app.py

      - name: Tests
        run: pytest -q

